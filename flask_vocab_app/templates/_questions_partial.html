        <form
            id="question-form"
            hx-post="/comprehension/answer"
            hx-target="#question-feedback"
            hx-swap="innerHTML"
        >
            <input type="hidden" name="story_title" value="{{ story.title }}" />
            <input type="hidden" name="story_title_en" value="{{ story.title_en | default('') }}" />
            <input type="hidden" name="story_id" value="{{ story.id | default('') }}" />
            <input type="hidden" name="story_text" value="{{ story.text | b64encode }}" />
            <input type="hidden" name="questions_b64" value="{{ story.questions | tojson | b64encode }}" />
            <input type="hidden" name="audio_url" value="{{ story.audio_url }}" />
            <input type="hidden" name="image_url" value="{{ story.image_url }}" />
            <input type="hidden" name="topic" value="{{ story.topic | default('any') }}" />
            <input type="hidden" name="difficulty" value="{{ story.difficulty | default('beginner') }}" />
            {% for question in story.questions %}
            <div class="question-card">
                <label for="story-answer-{{ loop.index0 }}" class="form-label"><strong>{{ ui_t('comprehension.question') }} {{ loop.index }}:</strong> {{ question }}</label>
                {% set answer = story.answers[loop.index0] if story.answers and loop.index0 < story.answers|length else '' %}
                <textarea id="story-answer-{{ loop.index0 }}" {% if preserve_answers %}hx-preserve{% endif %} name="answers[]" lang="ru" class="form-control" rows="4" data-question-index="{{ loop.index0 }}">{{ answer }}</textarea>
            </div>
            {% endfor %}
            {% if story.questions %}
            <button
                type="submit"
                class="btn btn-primary mt-3 grid-span-all"
            >
                {{ ui_t('comprehension.submit_answers') }}
            </button>
            {% endif %}
        </form>
        {% if not story.questions %}
        <div class="alert alert-warning grid-span-all">
            {{ ui_t('comprehension.no_questions') }}
        </div>
        {% endif %}
        <div id="question-feedback" role="status" class="question-feedback mt-2 grid-span-all"></div>
